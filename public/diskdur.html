<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinéClub — Disque dur</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="diskdur">
  <div id="nav-placeholder"></div>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">Sur le <em>disque dur</em></h1>
        <p class="page-subtitle" id="count-subtitle">Chargement…</p>
      </div>
    </div>

    <div class="toolbar">
      <input type="search" id="search-input" placeholder="Rechercher un film…">
      <select id="type-filter"></select>
      <select id="genre-filter"></select>
      <select id="sort-select">
        <option value="name-asc">Nom (A → Z)</option>
        <option value="name-desc">Nom (Z → A)</option>
      </select>
    </div>

    <div class="movie-grid" id="movie-grid">
      <div class="spinner-note">Chargement des films…</div>
    </div>
  </main>

  <footer class="footer">CinéClub — collection privée, entre nous.</footer>

  <script src="/js/nav.js"></script>
  <script src="/js/movies.js"></script>
  <script>
    const grid = document.getElementById('movie-grid');
    const searchInput = document.getElementById('search-input');
    const typeFilter = document.getElementById('type-filter');
    const genreFilter = document.getElementById('genre-filter');
    const sortSelect = document.getElementById('sort-select');
    const subtitle = document.getElementById('count-subtitle');
    let debounceTimer;

    function applyFilters() {
      const [sortBy, sortDir] = sortSelect.value.split('-');
      const movies = filterMovies({
        search: searchInput.value.trim(),
        type: typeFilter.value,
        genre: genreFilter.value,
        platform: 'disque dur',
        sortBy,
        sortDir,
      });
      subtitle.textContent = `${movies.length} film${movies.length > 1 ? 's' : ''} sur le disque dur`;
      renderMovieGrid(grid, movies);
    }

    [typeFilter, genreFilter, sortSelect].forEach(el => el.addEventListener('change', applyFilters));
    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(applyFilters, 200);
    });

    document.addEventListener('DOMContentLoaded', async () => {
      await loadAllMovies();
      populateFilterOptions(typeFilter, genreFilter, ALL_MOVIES.filter(m => m.platform === 'disque dur'));
      applyFilters();
    });
  </script>
</body>
</html>
